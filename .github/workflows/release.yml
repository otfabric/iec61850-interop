name: Release

# Tag push: publish that tag. Manual run: bump the latest vX.Y.Z tag
# (patch by default) on the selected branch and publish that.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: Semver component to increment from the latest vX.Y.Z tag
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write   # create the git tag and the GitHub release
  packages: write   # push to GHCR

env:
  REGISTRY: ghcr.io/otfabric

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      major: ${{ steps.resolve.outputs.major }}
      minor: ${{ steps.resolve.outputs.minor }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BUMP: ${{ github.event.inputs.bump || 'patch' }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="$(scripts/next-version.sh "${BUMP}")"
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "::error::tag ${tag} already exists"
              exit 1
            fi
          else
            tag="${REF_NAME}"
          fi
          [[ "${tag}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] \
            || { echo "::error::${tag} is not vX.Y.Z"; exit 1; }
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "major=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "minor=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          echo "releasing ${tag} (from ${EVENT_NAME})"

  validate:
    name: Validate fixtures and notes
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Validate fixtures and release notes
        env:
          VERSION: ${{ needs.version.outputs.tag }}
        run: |
          python3 scripts/validate-fixtures.py
          scripts/release-notes.sh "${VERSION}" > /dev/null \
            || { echo "::error::RELEASE.md has no notes for ${VERSION}"; exit 1; }

  build:
    name: ${{ matrix.image }} (${{ matrix.platform }})
    needs: [version, validate]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: libiec61850
            file: adapters/libiec61850/Dockerfile
            platform: linux/amd64
            runner: ubuntu-24.04
            slug: libiec61850-linux-amd64
          - image: libiec61850
            file: adapters/libiec61850/Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: libiec61850-linux-arm64
          - image: iec61850bean
            file: adapters/iec61850bean/Dockerfile
            platform: linux/amd64
            runner: ubuntu-24.04
            slug: iec61850bean-linux-amd64
          - image: iec61850bean
            file: adapters/iec61850bean/Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: iec61850bean-linux-arm64
          - image: dscsystems
            file: adapters/dscsystems/Dockerfile
            platform: linux/amd64
            runner: ubuntu-24.04
            slug: dscsystems-linux-amd64
          - image: dscsystems
            file: adapters/dscsystems/Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: dscsystems-linux-arm64
          - image: iec61850-rust
            file: adapters/iec61850-rust/Dockerfile
            platform: linux/amd64
            runner: ubuntu-24.04
            slug: iec61850-rust-linux-amd64
          - image: iec61850-rust
            file: adapters/iec61850-rust/Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: iec61850-rust-linux-arm64
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One platform per native runner. QEMU is not used: linux/amd64 builds
      # on ubuntu-24.04, linux/arm64 on ubuntu-24.04-arm. Images are pushed
      # by digest only; tags are applied after both platforms exist.
      # provenance/sbom are off so the digest is the image, not an attestation.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          provenance: false
          sbom: false
          build-args: |
            ADAPTER_VERSION=${{ needs.version.outputs.tag }}
          outputs: type=image,name=${{ env.REGISTRY }}/iec61850-interop-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.slug }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SLUG: ${{ matrix.slug }}
        run: |
          set -euo pipefail
          [ -n "${DIGEST}" ] || { echo "::error::build produced no digest"; exit 1; }
          mkdir -p "${RUNNER_TEMP}/digests"
          printf '%s' "${DIGEST}" > "${RUNNER_TEMP}/digests/${SLUG}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-arch manifests
    needs: [version, build]
    runs-on: ubuntu-24.04
    outputs:
      libiec61850-digest: ${{ steps.manifests.outputs.libiec61850 }}
      iec61850bean-digest: ${{ steps.manifests.outputs.iec61850bean }}
      dscsystems-digest: ${{ steps.manifests.outputs.dscsystems }}
      iec61850-rust-digest: ${{ steps.manifests.outputs.iec61850-rust }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Create manifests
        id: manifests
        env:
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          MAJOR: ${{ needs.version.outputs.major }}
          MINOR: ${{ needs.version.outputs.minor }}
        run: |
          set -euo pipefail
          publish() {
            local image="$1"
            local dest="${REGISTRY}/iec61850-interop-${image}"
            local refs=()
            local f
            for f in "${RUNNER_TEMP}/digests/${image}-linux-"*; do
              refs+=("${dest}@$(cat "${f}")")
            done
            [ "${#refs[@]}" -eq 2 ] || {
              echo "::error::expected 2 platform digests for ${image}, got ${#refs[@]}"
              ls -l "${RUNNER_TEMP}/digests" || true
              exit 1
            }
            docker buildx imagetools create \
              -t "${dest}:${TAG}" \
              -t "${dest}:${VERSION}" \
              -t "${dest}:${MINOR}" \
              -t "${dest}:${MAJOR}" \
              -t "${dest}:latest" \
              "${refs[@]}"
            local digest
            digest="$(docker buildx imagetools inspect "${dest}:${TAG}" \
              | awk '/^Digest:/{print $2; exit}')"
            [ -n "${digest}" ] || { echo "::error::no digest for ${dest}:${TAG}"; exit 1; }
            echo "${image}=${digest}" >> "$GITHUB_OUTPUT"
            echo "${image} ${digest}"
          }
          publish libiec61850
          publish iec61850bean
          publish dscsystems
          publish iec61850-rust

  release:
    name: GitHub release
    needs: [version, merge]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Write manifest.json
        env:
          VERSION: ${{ needs.version.outputs.tag }}
          LIBIEC61850_DIGEST: ${{ needs.merge.outputs.libiec61850-digest }}
          IEC61850BEAN_DIGEST: ${{ needs.merge.outputs.iec61850bean-digest }}
          DSCSYSTEMS_DIGEST: ${{ needs.merge.outputs.dscsystems-digest }}
          IEC61850RUST_DIGEST: ${{ needs.merge.outputs.iec61850-rust-digest }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > manifest.json
          import json, pathlib, re

          dockerfile = pathlib.Path("adapters/libiec61850/Dockerfile").read_text()
          sha_match = re.search(r"^ARG LIBIEC61850_SHA=(\S+)", dockerfile, re.M)
          pom = pathlib.Path("adapters/iec61850bean/pom.xml").read_text()
          pom_match = re.search(r"<artifactId>iec61850bean</artifactId>\s*<version>([^<]+)</version>", pom)
          caps = json.loads(pathlib.Path("fixtures/capabilities.json").read_text())
          dsc = pathlib.Path("adapters/dscsystems/Dockerfile").read_text()
          dsc_match = re.search(r"^ARG DSCSYSTEMS_SHA=(\S+)", dsc, re.M)
          rust = pathlib.Path("adapters/iec61850-rust/Dockerfile").read_text()
          rust_match = re.search(r"^ARG IEC61850_RUST_SHA=(\S+)", rust, re.M)

          print(json.dumps({
              "repository": "github.com/otfabric/iec61850-interop",
              "version": __import__("os").environ["VERSION"],
              "fixture": caps.get("fixtureRevision", ""),
              "mmsFixture": caps.get("mmsFixtureRevision", ""),
              "gooseFixture": caps.get("gooseFixtureRevision", ""),
              "svFixture": caps.get("svFixtureRevision", ""),
              "libiec61850": sha_match.group(1) if sha_match else "",
              "iec61850bean": pom_match.group(1) if pom_match else "1.9.0",
              "dscsystems": dsc_match.group(1) if dsc_match else "",
              "iec61850-rust": rust_match.group(1) if rust_match else "",
              "images": {
                  "libiec61850": __import__("os").environ["LIBIEC61850_DIGEST"],
                  "iec61850bean": __import__("os").environ["IEC61850BEAN_DIGEST"],
                  "dscsystems": __import__("os").environ["DSCSYSTEMS_DIGEST"],
                  "iec61850-rust": __import__("os").environ["IEC61850RUST_DIGEST"],
              },
          }, indent=2))
          PY
          cat manifest.json
          sha256sum manifest.json | tee checksums.txt

      - name: Write the release body
        env:
          VERSION: ${{ needs.version.outputs.tag }}
          LIBIEC61850_DIGEST: ${{ needs.merge.outputs.libiec61850-digest }}
          IEC61850BEAN_DIGEST: ${{ needs.merge.outputs.iec61850bean-digest }}
          DSCSYSTEMS_DIGEST: ${{ needs.merge.outputs.dscsystems-digest }}
          IEC61850RUST_DIGEST: ${{ needs.merge.outputs.iec61850-rust-digest }}
        run: |
          {
            scripts/release-notes.sh "${VERSION}"
            echo
            echo "## Adapter images"
            echo
            echo "| Image | Digest |"
            echo "|-------|--------|"
            echo "| \`ghcr.io/otfabric/iec61850-interop-libiec61850:${VERSION}\` | \`${LIBIEC61850_DIGEST}\` |"
            echo "| \`ghcr.io/otfabric/iec61850-interop-iec61850bean:${VERSION}\` | \`${IEC61850BEAN_DIGEST}\` |"
            echo "| \`ghcr.io/otfabric/iec61850-interop-dscsystems:${VERSION}\` (GPL-3.0) | \`${DSCSYSTEMS_DIGEST}\` |"
            echo "| \`ghcr.io/otfabric/iec61850-interop-iec61850-rust:${VERSION}\` | \`${IEC61850RUST_DIGEST}\` |"
            echo
            echo "## Pinning in consumer repositories"
            echo
            echo '```bash'
            echo "LIBIEC61850_IMAGE=ghcr.io/otfabric/iec61850-interop-libiec61850@${LIBIEC61850_DIGEST}"
            echo "IEC61850BEAN_IMAGE=ghcr.io/otfabric/iec61850-interop-iec61850bean@${IEC61850BEAN_DIGEST}"
            echo "DSCSYSTEMS_IMAGE=ghcr.io/otfabric/iec61850-interop-dscsystems@${DSCSYSTEMS_DIGEST}"
            echo "IEC61850RUST_IMAGE=ghcr.io/otfabric/iec61850-interop-iec61850-rust@${IEC61850RUST_DIGEST}"
            echo '```'
            echo
            echo "See \`manifest.json\` for full provenance (libiec61850 commit SHA, iec61850bean version, dscsystems/go-iec61850 and iec61850-rust commit SHAs, fixture revisions)."
          } > "${RUNNER_TEMP}/release-body.md"
          cat "${RUNNER_TEMP}/release-body.md"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ runner.temp }}/release-body.md
          files: |
            manifest.json
            checksums.txt
