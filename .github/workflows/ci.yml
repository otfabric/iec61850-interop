name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-fixtures:
    name: Validate fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate fixture syntax and cross-references
        run: python3 scripts/validate-fixtures.py

      - name: versions.yaml agrees with the build inputs
        run: python3 scripts/check-versions.py

      - name: RELEASE.md has the notes of the newest version
        run: scripts/release-notes.sh > /dev/null

      - name: Unit tests of the result scripts
        run: python3 -m unittest discover -q -s scripts -p 'test_*.py'

      - name: docs/CAPABILITIES.md and the README matrix match capabilities.json
        run: scripts/gen-coverage.sh --check

      - name: Shellcheck
        run: make lint

      - name: No reference to a library under test
        # REQUIREMENTS.md R1: adapters, fixtures, scripts and schemas must not
        # know any consumer. Documentation may name consumers as examples.
        # The bare name go-iec61850 is also dscsystems' upstream
        # (dscsystems/go-iec61850), so the pattern names our organisation;
        # a NOTICE may state that no code goes into our libraries.
        run: |
          if grep -rInE 'otfabric/go-|iec61850ctl|mmsctl' --exclude=NOTICE adapters fixtures schemas scripts Makefile compose.yaml; then
            echo "::error::consumer-specific reference found"; exit 1
          fi

  dscsystems-go:
    name: dscsystems adapter (go vet, gofmt)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters/dscsystems
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: adapters/dscsystems/go.mod
          cache-dependency-path: adapters/dscsystems/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet and build
        run: go mod verify && go vet ./... && go build -o /dev/null ./...

      - name: Unit tests with the race detector
        run: go test -race -count=1 ./...

      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          golangci-lint run ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  build-and-smoke:
    name: Build and smoke-test adapter images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build libiec61850 adapter image
        run: make build-libiec61850

      - name: Build iec61850bean adapter image
        run: make build-iec61850bean

      - name: Build dscsystems adapter image
        run: make build-dscsystems

      - name: Build iec61850-rust adapter image
        run: make build-iec61850-rust

      - name: Verify required binaries
        run: make verify-binaries

      - name: Verify fixture files in images
        run: make verify-fixtures

      # Each image's contract smoke test (scripts/smoke.sh: commands,
      # fixtures, ready events, same-stack clients, T-selectors), then the
      # cross-stack self-test (scripts/interop.sh): every stack's MMS and
      # IED clients and servers against libiec61850 in both directions, and
      # GOOSE and Sampled Values between every publisher and subscriber of
      # libiec61850, dscsystems and iec61850-rust, including the host side
      # of the bridge network as a Go test on a Linux host uses it (both SV
      # fixture streams, loss reported per pair, known-limitation pairs
      # checked to still fail).
      - name: Run adapter smoke tests
        run: make smoke

      - name: Cross-stack self-test
        run: make interop

      - name: Results (interop-result-v1)
        if: always()
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work mirror.gcr.io/library/python:3.12-slim \
            sh -c 'pip install -q --root-user-action=ignore jsonschema && python scripts/interop_result.py reports/results.json'

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: interop-results
          path: reports/
          if-no-files-found: ignore

      - name: Record build provenance
        if: always()
        run: |
          LIBIEC61850_SHA=$(grep 'LIBIEC61850_SHA=' adapters/libiec61850/Dockerfile \
            | head -1 | cut -d= -f2)
          IEC61850BEAN_VERSION=$(grep 'iec61850bean:' adapters/iec61850bean/pom.xml \
            | head -1 | sed 's/.*<version>\(.*\)<\/version>.*/\1/')
          echo "iec61850-interop SHA : ${{ github.sha }}"
          echo "libiec61850 SHA : ${LIBIEC61850_SHA}"
          echo "iec61850bean    : ${IEC61850BEAN_VERSION:-1.9.0}"
          echo "dscsystems      : $(grep 'ARG DSCSYSTEMS_SHA=' adapters/dscsystems/Dockerfile | cut -d= -f2)"
          echo "iec61850-rust   : $(grep 'ARG IEC61850_RUST_SHA=' adapters/iec61850-rust/Dockerfile | cut -d= -f2)"
          echo "platform        : linux/amd64"
