name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  validate-fixtures:
    name: Validate fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate fixture syntax and cross-references
        run: python3 scripts/validate-fixtures.py

      - name: RELEASE.md has the notes of the newest version
        run: scripts/release-notes.sh > /dev/null

      - name: COVERAGE.md and the README matrix match capabilities.json
        run: scripts/gen-coverage.sh --check

  dscsystems-go:
    name: dscsystems adapter (go vet, gofmt)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters/dscsystems
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: adapters/dscsystems/go.mod
          cache-dependency-path: adapters/dscsystems/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet and build
        run: go mod verify && go vet ./... && go build ./...

  build-and-smoke:
    name: Build and smoke-test adapter images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build libiec61850 adapter image
        run: make build-libiec61850

      - name: Build iec61850bean adapter image
        run: make build-iec61850bean

      - name: Build dscsystems adapter image
        run: make build-dscsystems

      - name: Build iec61850-rust adapter image
        run: make build-iec61850-rust

      - name: Verify required binaries
        run: make verify-binaries

      - name: Verify fixture files in images
        run: make verify-fixtures

      # Run the full smoke suite: server ready events, client JSON Lines
      # output (same stack, and libiec61850 <-> dscsystems / iec61850-rust in
      # both directions), and GOOSE publisher -> subscriber between
      # libiec61850, dscsystems and iec61850-rust for every pair, including
      # the host side of the bridge network as a Go test on a Linux host
      # uses it; the same for Sampled Values (both fixture streams, loss
      # reported per pair, known-limitation pairs checked to still fail).
      - name: Run adapter smoke tests
        run: |
          LIBIEC61850_IMAGE=iec61850-interop-libiec61850:local \
          IEC61850BEAN_IMAGE=iec61850-interop-iec61850bean:local \
          DSCSYSTEMS_IMAGE=iec61850-interop-dscsystems:local \
          IEC61850RUST_IMAGE=iec61850-interop-iec61850-rust:local \
          ./scripts/smoke-test.sh

      - name: Record build provenance
        if: always()
        run: |
          LIBIEC61850_SHA=$(grep 'LIBIEC61850_SHA=' adapters/libiec61850/Dockerfile \
            | head -1 | cut -d= -f2)
          IEC61850BEAN_VERSION=$(grep 'iec61850bean:' adapters/iec61850bean/pom.xml \
            | head -1 | sed 's/.*<version>\(.*\)<\/version>.*/\1/')
          echo "iec61850-interop SHA : ${{ github.sha }}"
          echo "libiec61850 SHA : ${LIBIEC61850_SHA}"
          echo "iec61850bean    : ${IEC61850BEAN_VERSION:-1.9.0}"
          echo "dscsystems      : $(grep 'ARG DSCSYSTEMS_SHA=' adapters/dscsystems/Dockerfile | cut -d= -f2)"
          echo "iec61850-rust   : $(grep 'ARG IEC61850_RUST_SHA=' adapters/iec61850-rust/Dockerfile | cut -d= -f2)"
          echo "platform        : linux/amd64"
