name: Upstream candidates
run-name: "Candidate upstream probe by @${{ github.actor }}"

# Resolves newer upstreams, builds candidate images, and publishes a pin-vs-latest
# decision table in the workflow Job Summary. Release pins are never mutated.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-libiec61850:
    name: libiec61850
    runs-on: ubuntu-latest
    outputs:
      pin: ${{ steps.resolve.outputs.pin }}
      pin_tag: ${{ steps.resolve.outputs.pin_tag }}
      latest_tag: ${{ steps.resolve.outputs.latest_tag }}
      latest_tag_sha: ${{ steps.resolve.outputs.latest_tag_sha }}
      tip_sha: ${{ steps.resolve.outputs.tip_sha }}
      update: ${{ steps.resolve.outputs.update }}
      tip_build: ${{ steps.build.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve libiec61850 pin vs upstream
        id: resolve
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          import subprocess
          import sys
          from pathlib import Path

          repo = "https://github.com/mz-automation/libiec61850.git"
          pin = next(
              line.split("=", 1)[1].strip()
              for line in Path("adapters/libiec61850/Dockerfile").read_text().splitlines()
              if line.startswith("ARG LIBIEC61850_SHA=")
          )
          tip = subprocess.check_output(
              ["git", "ls-remote", repo, "HEAD"], text=True
          ).split()[0]

          tags = subprocess.check_output(
              ["git", "ls-remote", "--tags", "--refs", repo], text=True
          ).splitlines()

          semver = re.compile(r"^v?(\d+)\.(\d+)\.(\d+)$")
          pin_tag = ""
          latest_tag = ""
          latest_tag_sha = ""
          latest_key = None

          for line in tags:
              sha, ref = line.split()
              tag = ref.removeprefix("refs/tags/")
              if sha == pin:
                  pin_tag = tag
              m = semver.match(tag)
              if not m:
                  continue
              key = tuple(int(x) for x in m.groups())
              if latest_key is None or key > latest_key:
                  latest_key = key
                  latest_tag = tag
                  latest_tag_sha = sha

          update = "yes" if pin != latest_tag_sha or pin != tip else "no"

          print(f"pin={pin}")
          print(f"pin_tag={pin_tag}")
          print(f"latest_tag={latest_tag}")
          print(f"latest_tag_sha={latest_tag_sha}")
          print(f"tip_sha={tip}")
          print(f"update={update}")
          print(
              f"resolved pin={pin} ({pin_tag or 'untagged'}) "
              f"latest={latest_tag}@{latest_tag_sha[:12]} tip={tip[:12]} update={update}",
              file=sys.stderr,
          )
          PY

      - name: Build image at upstream HEAD
        id: build
        continue-on-error: true
        run: |
          docker buildx build --platform=linux/amd64 --load \
            -f adapters/libiec61850/Dockerfile \
            --build-arg "LIBIEC61850_SHA=${{ steps.resolve.outputs.tip_sha }}" \
            -t iec61850-interop-libiec61850:candidate \
            .

  candidate-iec61850bean:
    name: iec61850bean
    runs-on: ubuntu-latest
    outputs:
      pin: ${{ steps.resolve.outputs.pin }}
      latest: ${{ steps.resolve.outputs.latest }}
      update: ${{ steps.resolve.outputs.update }}
      build: ${{ steps.build.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve iec61850bean pin vs Maven Central
        id: resolve
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          import sys
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = ET.fromstring(
              urllib.request.urlopen(
                  "https://repo1.maven.org/maven2/com/beanit/iec61850bean/maven-metadata.xml"
              ).read()
          )
          latest = root.findtext("versioning/latest") or root.findtext("versioning/release")
          if not latest:
              raise SystemExit("could not resolve latest iec61850bean version")

          text = Path("adapters/iec61850bean/pom.xml").read_text()
          m = re.search(
              r"<artifactId>iec61850bean</artifactId>\s*<version>([^<]+)</version>",
              text,
          )
          if not m:
              raise SystemExit("could not read release pin from pom.xml")
          pin = m.group(1)
          update = "yes" if pin != latest else "no"

          print(f"pin={pin}")
          print(f"latest={latest}")
          print(f"update={update}")
          print(f"resolved pin={pin} latest={latest} update={update}", file=sys.stderr)
          PY

      - name: Build image at Maven latest
        id: build
        continue-on-error: true
        run: |
          cp adapters/iec61850bean/pom.xml /tmp/pom.release
          python3 - <<'PY'
          import pathlib
          import re
          path = pathlib.Path("adapters/iec61850bean/pom.xml")
          text = path.read_text()
          ver = "${{ steps.resolve.outputs.latest }}"
          updated, n = re.subn(
              r"(<artifactId>iec61850bean</artifactId>\s*<version>)[^<]+(</version>)",
              rf"\g<1>{ver}\g<2>",
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit("failed to rewrite iec61850bean version in pom.xml")
          path.write_text(updated)
          PY
          docker buildx build --platform=linux/amd64 --load \
            -f adapters/iec61850bean/Dockerfile \
            -t iec61850-interop-iec61850bean:candidate \
            .
          mv /tmp/pom.release adapters/iec61850bean/pom.xml

  summary:
    name: Decision table
    runs-on: ubuntu-latest
    needs: [candidate-libiec61850, candidate-iec61850bean]
    if: always()
    steps:
      - name: Write pin-vs-latest summary
        env:
          LIB_PIN: ${{ needs.candidate-libiec61850.outputs.pin }}
          LIB_PIN_TAG: ${{ needs.candidate-libiec61850.outputs.pin_tag }}
          LIB_LATEST_TAG: ${{ needs.candidate-libiec61850.outputs.latest_tag }}
          LIB_LATEST_TAG_SHA: ${{ needs.candidate-libiec61850.outputs.latest_tag_sha }}
          LIB_TIP: ${{ needs.candidate-libiec61850.outputs.tip_sha }}
          LIB_UPDATE: ${{ needs.candidate-libiec61850.outputs.update }}
          LIB_BUILD: ${{ needs.candidate-libiec61850.outputs.tip_build }}
          BEAN_PIN: ${{ needs.candidate-iec61850bean.outputs.pin }}
          BEAN_LATEST: ${{ needs.candidate-iec61850bean.outputs.latest }}
          BEAN_UPDATE: ${{ needs.candidate-iec61850bean.outputs.update }}
          BEAN_BUILD: ${{ needs.candidate-iec61850bean.outputs.build }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os

          def short(sha: str, n: int = 12) -> str:
              return sha[:n] if sha else "?"

          lib_pin = os.environ.get("LIB_PIN", "")
          lib_pin_tag = os.environ.get("LIB_PIN_TAG", "")
          lib_latest_tag = os.environ.get("LIB_LATEST_TAG", "")
          lib_latest_sha = os.environ.get("LIB_LATEST_TAG_SHA", "")
          lib_tip = os.environ.get("LIB_TIP", "")
          lib_update = os.environ.get("LIB_UPDATE", "?")
          lib_build = os.environ.get("LIB_BUILD", "?")
          bean_pin = os.environ.get("BEAN_PIN", "")
          bean_latest = os.environ.get("BEAN_LATEST", "")
          bean_update = os.environ.get("BEAN_UPDATE", "?")
          bean_build = os.environ.get("BEAN_BUILD", "?")

          if lib_pin_tag:
              lib_pin_label = f"`{lib_pin_tag}` (`{short(lib_pin)}`)"
          else:
              lib_pin_label = f"`{short(lib_pin)}`"
          lib_latest_label = (
              f"`{lib_latest_tag}` (`{short(lib_latest_sha)}`)<br>HEAD `{short(lib_tip)}`"
          )

          print("## Upstream candidate report")
          print()
          print("Release pins were **not** modified. Use this table to decide whether to bump.")
          print()
          print("| Stack | Kind | Release pin | Latest upstream | Candidate build | Update? |")
          print("|---|---|---|---|---|---|")
          print(
              f"| [libiec61850](https://github.com/mz-automation/libiec61850) | git tag / SHA | "
              f"{lib_pin_label} | {lib_latest_label} | `{lib_build}` (HEAD) | **{lib_update}** |"
          )
          print(
              f"| [iec61850bean](https://repo1.maven.org/maven2/com/beanit/iec61850bean/) | Maven semver | "
              f"`{bean_pin}` | `{bean_latest}` | `{bean_build}` | **{bean_update}** |"
          )
          print()
          print("### Pin locations")
          print()
          print("- libiec61850: `adapters/libiec61850/Dockerfile` (`LIBIEC61850_SHA`)")
          print("- iec61850bean: `adapters/iec61850bean/pom.xml` (`com.beanit:iec61850bean`)")
          print()
          print("### How to read this")
          print()
          print("- **Update? = yes** means pin ≠ latest release and/or tip.")
          print("- **Candidate build** is a Docker build of tip/latest only; it does not run the smoke suite.")
          print("- Bump deliberately after reviewing upstream changelog / release notes.")
          PY
