name: Upstream
run-name: "Upstream check (${{ github.event_name }})"

# Daily check of every pin against the latest upstream
# (scripts/latest-upstream.py): libiec61850, dscsystems/go-iec61850 and
# csp0924/iec61850-rust are pinned by commit and compared with the head of
# their default branch, iec61850bean with its latest release on Maven
# Central; and the digest of every base image. An adapter whose pin is behind
# is built at the latest upstream (scripts/build-candidate.sh; once per
# pin -> latest pair, later runs reuse that result). The table goes to the Job
# Summary and to the issue "Upstream releases: pins behind the latest", which
# is opened or updated (with a comment when a new version shows up) and closed
# once every pin is current. Pins are never changed here: a bump is a
# reviewed change that CI smoke-tests. Shared steps:
# https://github.com/otfabric/.github/tree/main/actions
on:
  schedule:
    - cron: "23 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream
  cancel-in-progress: false

env:
  BASE_REGISTRY: mirror.gcr.io/library

jobs:
  images:
    name: Base images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: otfabric/.github/actions/upstream-images@v2.1.0

  candidate:
    name: ${{ matrix.adapter }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        adapter: [libiec61850, iec61850bean, dscsystems, iec61850-rust]
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the pin against upstream
        id: resolve
        # bash: -eo pipefail, so a failing lookup fails this job too.
        shell: bash
        run: scripts/latest-upstream.py "${{ matrix.adapter }}" | tee -a "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.resolve.outputs.update == 'yes'
        uses: docker/setup-buildx-action@v4

      - name: Build the image at the latest upstream
        id: test
        if: steps.resolve.outputs.update == 'yes'
        uses: otfabric/.github/actions/upstream-candidate@v2.1.0
        with:
          name: ${{ matrix.adapter }}
          pinned: ${{ steps.resolve.outputs.pin }}
          latest: ${{ steps.resolve.outputs.latest }}
          result-pattern: '^\[candidate\] .* built$'
          command: >-
            scripts/build-candidate.sh "${{ matrix.adapter }}"
            "${{ steps.resolve.outputs.latest_sha || steps.resolve.outputs.latest }}"

      - name: Table row
        if: always()
        uses: otfabric/.github/actions/upstream-row@v2.1.0
        with:
          component: ${{ matrix.adapter }}
          kind: ${{ steps.resolve.outputs.kind || 'library' }}
          source: ${{ steps.resolve.outputs.source }}
          pinned: ${{ steps.resolve.outputs.pin }}
          latest: ${{ steps.resolve.outputs.latest }}
          update: ${{ steps.resolve.outputs.update }}
          detail: ${{ steps.resolve.outcome == 'failure' && 'upstream lookup failed (see the job log)' || '' }}
          test-outcome: ${{ steps.test.outputs.outcome }}
          test-result: ${{ steps.test.outputs.result }}
          test-cached: ${{ steps.test.outputs.cached }}

  report:
    name: Report
    runs-on: ubuntu-latest
    needs: [images, candidate]
    if: always()
    permissions:
      contents: read
      issues: write
    steps:
      - uses: otfabric/.github/actions/upstream-report@v2.1.0
        with:
          needs: ${{ toJSON(needs) }}
          notes: |
            ### To update

            - **Commit** (libiec61850, dscsystems, iec61850-rust): move the commit in
              `adapters/<adapter>/Dockerfile` (`LIBIEC61850_SHA`, `DSCSYSTEMS_SHA`,
              `IEC61850_RUST_SHA`) and its comment; dscsystems also in `go.mod`/`go.sum`
              (`go get github.com/dscsystems/go-iec61850@<commit>`), iec61850-rust also every
              `rev` in `Cargo.toml` and `Cargo.lock`. A tagged dscsystems commit resolves to its
              tag in `go.mod`, which the Dockerfile's pseudo-version check does not accept yet.
            - **Library** (iec61850bean): the `com.beanit:iec61850bean` version in
              `adapters/iec61850bean/pom.xml`.
            - Reproduce a candidate with `scripts/build-candidate.sh <adapter> <commit|version>`,
              then `make ci`. The candidate here is a build only; CI smoke-tests the bump.
            - **Base image:** replace the digest in every file that pins it.
            - Record the change in `fixtures/capabilities.json` (upstream versions) and `RELEASE.md`.
