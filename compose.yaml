# Manual debugging compose file.
#
# This file is for interactive inspection only.  Go tests manage the full
# adapter lifecycle themselves (REQ-7.1); do not use this file in CI.
#
# Start the libiec61850 MMS server on host port 1102:
#   make build
#   docker compose --profile libiec61850 up -d
#
# Connect with a raw MMS client:
#   nc -z localhost 1102 && echo "port open"

name: iec61850-interop

services:
  libiec61850-mms-server:
    profiles: ["libiec61850"]
    build:
      context: .
      dockerfile: adapters/libiec61850/Dockerfile
      platforms:
        - linux/amd64
    image: iec61850-interop-libiec61850:local
    platform: linux/amd64
    environment:
      MMS_INTEROP_ADDRESS: "0.0.0.0"
      MMS_INTEROP_PORT: "1102"
    ports:
      - "1102:1102"
    volumes:
      - ./fixtures/mms:/fixtures/mms:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/1102"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 10s
    command:
      - "--fixture"
      - "/fixtures/mms/interop.json"
      - "--port"
      - "1102"

  # -------------------------------------------------------------------------
  # GOOSE (layer 2): a libiec61850 publisher and a dscsystems subscriber on
  # the bridge network below. See docs/goose.md.
  #
  #   make build-libiec61850 build-dscsystems
  #   docker compose --profile goose up
  #
  # The host side of the segment is the bridge device goose0: a Go test on
  # a Linux host opens goose0 (CAP_NET_RAW) to exchange frames with these
  # containers.
  # -------------------------------------------------------------------------
  libiec61850-goose-publisher:
    profiles: ["goose"]
    image: iec61850-interop-libiec61850:local
    platform: linux/amd64
    networks: [goose]
    cap_drop: [ALL]
    cap_add: [NET_RAW, NET_ADMIN]
    stdin_open: true
    entrypoint: ["libiec61850-goose-publisher"]
    command:
      - "--iface"
      - "eth0"
      - "--gocb-ref"
      - "InteropIEDInteropLD/LLN0$$GO$$gcbBool"
      - "--go-id"
      - "InteropGooseBool"
      - "--dataset"
      - "InteropIEDInteropLD/LLN0$$dsGooseBool"
      - "--app-id"
      - "0x1002"
      - "--dst"
      - "01:0c:cd:01:00:02"
      - "--values"
      - '[{"type":"boolean","value":false},{"type":"bit-string","value":"0000000000000"}]'

  dscsystems-goose-subscriber:
    profiles: ["goose"]
    image: iec61850-interop-dscsystems:local
    platform: linux/amd64
    networks: [goose]
    cap_drop: [ALL]
    cap_add: [NET_RAW, NET_ADMIN]
    entrypoint: ["dscsystems-goose-subscriber"]
    command: ["--iface", "eth0", "--app-id", "0x1002"]

networks:
  goose:
    name: iec61850-interop-goose
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: goose0
