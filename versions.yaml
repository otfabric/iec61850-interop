# Machine-readable version manifest of iec61850-interop. The Dockerfiles and
# pom.xml are the source of truth for a build; scripts/check-versions.py
# (make validate-fixtures) fails when this file disagrees with them.
# Upstreams are pinned by commit or exact version; no source archive hash is
# recorded. Which command exists in which image: fixtures/capabilities.json.

interop_version: "1.6.0"
contract_version: "1.4"        # docs/CONTAINER_CONTRACT.md, semver from v1.0.0

protocol:
  name: "IEC 61850 (MMS, GOOSE, Sampled Values)"

implementations:
  libiec61850:
    upstream: "MZ Automation libiec61850"
    repository: "https://github.com/mz-automation/libiec61850"
    revision: "6e265c54af66ea686453b6d31c4dcce1cf7ad2bd"
    license: "GPL-3.0-only (or commercial)"
    # Built into libhal for R-GOOSE/R-SV (HMAC), the version libiec61850's
    # README names; also gives the library TLS, which no adapter configures.
    mbedtls_version: "v3.6.0"
    mbedtls_revision: "2ca6c285a0dd3f33982dd57299012dacab1ff206"
    mbedtls_license: "Apache-2.0 OR GPL-2.0-or-later"
    roles: [mms, ied, goose, sv]
    published: true
    pinned_in:
      - adapters/libiec61850/Dockerfile
  iec61850bean:
    upstream: "beanit iec61850bean"
    repository: "https://github.com/beanit/iec61850bean"
    version: "1.9.0"
    license: "Apache-2.0"
    roles: [ied]
    published: true
    pinned_in:
      - adapters/iec61850bean/pom.xml
  dscsystems:
    upstream: "dscsystems go-iec61850"
    repository: "https://github.com/dscsystems/go-iec61850"
    version: "v0.6.6"
    revision: "4833767caf3abbf1f205c4c49cd9432744beaf83"
    license: "GPL-3.0"
    roles: [mms, ied, goose, sv]
    published: true
    pinned_in:
      - adapters/dscsystems/Dockerfile
  iec61850-rust:
    upstream: "iec61850-rust"
    repository: "https://github.com/csp0924/iec61850-rust"
    revision: "d4e895217f367ed4caebf21611d2c16ee46035c0"
    license: "MIT OR Apache-2.0"
    roles: [mms, ied, goose, sv]
    published: true
    pinned_in:
      - adapters/iec61850-rust/Dockerfile
  cbsigma:
    upstream: "cB-Sigma iec61850 and iec61850-sim"
    repository: "https://github.com/cB-Sigma/iec61850"
    module: "github.com/cB-Sigma/iec61850"
    version: "v0.1.0"            # tag; cB-Sigma publishes no releases
    revision: "f121ba3464665ea06a0e7f7bc81316beb7312dd2"
    sim_repository: "https://github.com/cB-Sigma/iec61850-sim"
    sim_module: "github.com/cB-Sigma/iec61850-sim"
    sim_version: "v0.1.0"
    sim_revision: "92530d85723c40afd8514ec45e3b89184a5eae1e"
    license: "Apache-2.0"
    language: "Go"
    independent_engine: true
    roles: [ied, goose]
    published: true
    note: >-
      The client (MMS, IEC 61850 services, GOOSE) is cB-Sigma/iec61850, the
      server the simulated IED of cB-Sigma/iec61850-sim, which builds its
      model from the fixture ICD with its own SCL loader. The ICCP / TASE.2
      simulator is out of scope. Its own modules iotsec, iotcrypto and xsd
      are Apache-2.0; golang.org/x/net, x/sys and x/text BSD-3-Clause;
      gopkg.in/yaml.v3 Apache-2.0 and MIT. The versions of every module are
      in adapters/cbsigma/go.mod.
    pinned_in:
      - adapters/cbsigma/Dockerfile
      - adapters/cbsigma/go.mod
      - adapters/cbsigma/NOTICE

base_images:
  # Multi-arch index digests, pinned in the Dockerfiles.
  debian:
    image: "docker.io/library/debian:bookworm-slim@sha256:7b140f374b289a7c2befc338f42ebe6441b7ea838a042bbd5acbfca6ec875818"
    used_by: [libiec61850, dscsystems, iec61850-rust, cbsigma, otfabric]
  golang:
    image: "docker.io/library/golang:1.27.3-bookworm@sha256:972b4110ba0f47539a975c31e52c64765e1ff19f2d74469ae4a595c6676e80a5"
    used_by: [dscsystems, cbsigma, otfabric]
  rust:
    image: "docker.io/library/rust:1.95.0-bookworm@sha256:6258907abe69656e41cd992e0b705cdcfabcbbe3db374f92ed2d47121282d4a1"
    used_by: [iec61850-rust]
  maven:
    image: "docker.io/library/maven:3.9.9-eclipse-temurin-21@sha256:3a4ab3276a087bf276f79cae96b1af04f53731bec53fb2e651aca79e4b10211e"
    used_by: [iec61850bean]
  temurin_jre:
    image: "docker.io/library/eclipse-temurin:21.0.7_6-jre-jammy@sha256:c4e6542e774de504da9b4729ff8d761287c965c1d788528ca78da30024efdb23"
    used_by: [iec61850bean]

# OT Fabric's own stack behind the same contract (ADR-0012, own/go-iec61850/
# README.md). Not an independent implementation, not in a release or its
# manifest.json; built and published by hand by the "Own stack (go-iec61850)"
# workflow from the latest go-iec61850 and go-mms releases.
own_implementations:
  otfabric:
    upstream: "go-iec61850"
    repository: "https://github.com/otfabric/go-iec61850"
    artifact: "go:github.com/otfabric/go-iec61850"
    version: "latest release, resolved when the image is built by hand"
    mms_upstream: "go:github.com/otfabric/go-mms, latest release"
    license: "MIT"
    language: "Go"
    independent_engine: false
    roles: [mms, ied, goose, sv]
    image: "ghcr.io/otfabric/iec61850-interop-otfabric"
    build: "own/go-iec61850"
